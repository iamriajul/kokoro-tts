name: Container

# Builds the image and publishes it to ghcr.io so the Kubernetes manifest can
# reference a published artifact instead of an ad-hoc local build.
#
# Tags produced:
#   :main          latest commit on the default branch
#   :<sha>         immutable per-commit tag
#   :vX.Y.Z        release tags
#   :latest        moving tag for the default branch

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both the prebuilt audio.cpp binaries and the Kokoro GGUF are fetched at
      # build time. The GGUF must come from the audio-cpp org specifically: only
      # that copy embeds the audio.cpp model spec, and audiocpp_server refuses a
      # GGUF without it — a byte-identical-looking file from another publisher is
      # rejected with "does not embed an audio.cpp model spec".
      - name: Fetch prebuilt audio.cpp (portable Vulkan)
        run: |
          set -euo pipefail
          mkdir -p audiocpp
          curl -sL --retry 3 -o /tmp/acpp.tar.gz \
            "https://github.com/0xShug0/audio.cpp/releases/download/v0.9.0/audio-v0.9.0-bin-ubuntu-x64-vulkan-portable.tar.gz"
          # CPU backends are dlopen'd by name, so take the generic x64 variant
          # plus the versioned SONAME libs. libggml-vulkan.so is the whole point:
          # it is what lets the server use the GPU.
          # Members are stored with a leading ./ so extraction must match.
          tar xzf /tmp/acpp.tar.gz -C audiocpp \
            ./audiocpp_server ./audiocpp_gguf \
            ./libggml-base.so.0 ./libggml-base.so.0.12.0 \
            ./libggml.so.0 ./libggml.so.0.12.0 \
            ./libggml-cpu-x64.so ./libggml-vulkan.so
          ls -l audiocpp

      - name: Fetch Kokoro GGUF
        run: |
          set -euo pipefail
          mkdir -p models
          curl -sL --retry 3 -o models/kokoro-82m-q8_0.gguf \
            "https://huggingface.co/audio-cpp/audio.cpp-gguf/resolve/main/Kokoro-82M-GGUF/kokoro-82m-q8_0.gguf"
          actual=$(stat -c%s models/kokoro-82m-q8_0.gguf)
          echo "size: $actual"
          test "$actual" = "189549408" || { echo "GGUF size mismatch"; exit 1; }

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # type=ref,event=branch yields the branch name, so pushes to main
          # publish :main; type=sha gives an immutable per-commit tag; the raw
          # latest tag follows the default branch.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The Vulkan shader build is CPU-heavy, so give the builder real cores.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Container packages are created with private visibility on first push,
      # which makes them unpullable anonymously — the kubelet then sits in
      # ImagePullBackOff because the deployment manifest carries no
      # imagePullSecrets. Flip the package to public after the push.
      #
      # Uses GraphQL: the REST packages API has no visibility endpoint, and
      # packages.updatePackageVisibility does not exist on the script octokit.
      - name: Set package visibility to public
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const name = '${{ env.IMAGE_NAME }}'.split('/').pop();
            const q = `mutation($id: ID!) {
              updatePackageVisibility(input: { packageId: $id, visibility: PUBLIC }) {
                package { id visibility }
              }
            }`;
            const find = `query($owner: String!, $name: String!) {
              viewer { packages(first: 100, packageType: CONTAINER) {
                nodes { id name packageType visibility }
              } }
            }`;
            const { viewer } = await github.graphql(find);
            const pkg = viewer.packages.nodes.find(p => p.name === name);
            if (!pkg) throw new Error(`package ${name} not found in ${owner}'s container packages`);
            if (pkg.visibility === 'PUBLIC') { console.log(`${name} already public`); return; }
            await github.graphql(q, { id: pkg.id });
            console.log(`${name}: ${pkg.visibility} -> PUBLIC`);
